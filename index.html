<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MADA DEEP RESCUE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #040914;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      border: 4px solid #1e3a5f;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.3);
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    #gamepad-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      pointer-events: none;
    }
    #gamepad-badge.connected {
      border-color: #22c55e;
      color: #22c55e;
    }
    /* Controles Touch para Celular */
    #touch-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
      padding: 12px 20px;
      margin-top: 8px;
    }
    @media (pointer: coarse) {
      #touch-controls { display: flex; }
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
    }
    .btn-touch {
      background: rgba(30, 58, 95, 0.8);
      border: 2px solid #38bdf8;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-touch:active { background: #38bdf8; color: #000; }
    .btn-fire {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.8);
      border: 3px solid #fca5a5;
      font-size: 16px;
      align-self: center;
    }
    .btn-fire:active { background: #ef4444; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="gamepad-badge">CONTROLE BT: AGUARDANDO</div>
  </div>

  <div id="touch-controls">
    <div class="dpad">
      <div></div>
      <div class="btn-touch" data-key="ArrowUp">▲</div>
      <div></div>
      <div class="btn-touch" data-key="ArrowLeft">◄</div>
      <div></div>
      <div class="btn-touch" data-key="ArrowRight">►</div>
      <div></div>
      <div class="btn-touch" data-key="ArrowDown">▼</div>
      <div></div>
    </div>
    <div class="btn-touch btn-fire" data-key="Space">TORPEDO</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const gpBadge = document.getElementById('gamepad-badge');

    // Áudio Retrô Web Audio API
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type, duration, vol = 0.12, slide = 0) {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slide !== 0) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const sfx = {
      select: () => playTone(440, 'square', 0.08, 0.08),
      shoot: () => playTone(620, 'square', 0.12, 0.1, -400),
      hit: () => playTone(160, 'sawtooth', 0.2, 0.15, -110),
      rescue: () => {
        playTone(523, 'triangle', 0.1, 0.15);
        setTimeout(() => playTone(784, 'triangle', 0.16, 0.15), 80);
      },
      surface: () => {
        playTone(440, 'sine', 0.12, 0.15);
        setTimeout(() => playTone(660, 'sine', 0.12, 0.15), 100);
        setTimeout(() => playTone(880, 'sine', 0.25, 0.15), 200);
      },
      victory: () => {
        [523, 659, 784, 1046].forEach((f, idx) => {
          setTimeout(() => playTone(f, 'square', 0.18, 0.15), idx * 140);
        });
      },
      die: () => playTone(200, 'sawtooth', 0.6, 0.2, -160)
    };

    // Configurações de Dificuldade e 20 Fases
    const MAX_LEVELS = 20;
    const INITIAL_LIVES = 10;

    const DIFFICULTIES = [
      {
        name: 'FÁCIL',
        color: '#4ade80',
        speedMult: 0.65,
        spawnRate: 0.016,
        maxEnemiesBase: 3,
        oxygenDrain: 0.032,
        scoreMult: 1
      },
      {
        name: 'NORMAL',
        color: '#38bdf8',
        speedMult: 0.85,
        spawnRate: 0.022,
        maxEnemiesBase: 4,
        oxygenDrain: 0.045,
        scoreMult: 1.5
      },
      {
        name: 'DIFÍCIL',
        color: '#f87171',
        speedMult: 1.12,
        spawnRate: 0.032,
        maxEnemiesBase: 5,
        oxygenDrain: 0.065,
        scoreMult: 2
      }
    ];

    let diffIndex = 1; // 0 = Fácil, 1 = Normal, 2 = Difícil

    // Estado do Jogo
    let state = 'START'; // START, PLAYING, GAMEOVER, VICTORY
    let score = 0;
    let highScore = Number(localStorage.getItem('mada_deep_hi') || 0);
    let lives = INITIAL_LIVES;
    let level = 1;
    let oxygen = 100;
    let rescuedCount = 0;
    let frame = 0;
    let flashTimer = 0;

    const SURFACE_Y = 105;
    const FLOOR_Y = 515;

    const player = {
      x: 380,
      y: SURFACE_Y,
      w: 54,
      h: 22,
      dir: 1,
      speed: 4.8,
      cooldown: 0,
      invuln: 0
    };

    let torpedoes = [];
    let enemies = [];
    let divers = [];
    let particles = [];
    let patrolSub = null;

    function changeDifficulty(delta) {
      diffIndex = (diffIndex + delta + DIFFICULTIES.length) % DIFFICULTIES.length;
      sfx.select();
    }

    // Teclado & Touch
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (state === 'START') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeDifficulty(-1);
        if (e.code === 'ArrowRight' || e.code === 'KeyD') changeDifficulty(1);
        if (e.code === 'Enter' || e.code === 'Space') startGame();
      } else if (state === 'GAMEOVER' || state === 'VICTORY') {
        if (e.code === 'Enter' || e.code === 'Space') {
          state = 'START';
          sfx.select();
        }
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    document.querySelectorAll('.btn-touch').forEach(btn => {
      const k = btn.dataset.key;
      btn.addEventListener('touchstart', e => {
        e.preventDefault();
        keys[k] = true;
        if (state === 'START') {
          if (k === 'ArrowLeft') changeDifficulty(-1);
          else if (k === 'ArrowRight') changeDifficulty(1);
          else if (k === 'Space') startGame();
        } else if (state === 'GAMEOVER' || state === 'VICTORY') {
          if (k === 'Space') {
            state = 'START';
            sfx.select();
          }
        }
      });
      btn.addEventListener('touchend', e => {
        e.preventDefault();
        keys[k] = false;
      });
    });

    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const cx = (e.clientX - rect.left) * scaleX;
      const cy = (e.clientY - rect.top) * scaleY;

      if (state === 'START') {
        if (cy >= 315 && cy <= 360) {
          if (cx >= 165 && cx <= 305) { diffIndex = 0; sfx.select(); return; }
          if (cx >= 330 && cx <= 470) { diffIndex = 1; sfx.select(); return; }
          if (cx >= 495 && cx <= 635) { diffIndex = 2; sfx.select(); return; }
        }
        startGame();
      } else if (state === 'GAMEOVER' || state === 'VICTORY') {
        state = 'START';
        sfx.select();
      }
    });

    // Controle Bluetooth (Gamepad API)
    let gpStartLatch = false;
    let gpNavLatch = false;

    window.addEventListener('gamepadconnected', () => {
      gpBadge.textContent = 'CONTROLE BT: CONECTADO';
      gpBadge.classList.add('connected');
    });
    window.addEventListener('gamepaddisconnected', () => {
      gpBadge.textContent = 'CONTROLE BT: DESCONECTADO';
      gpBadge.classList.remove('connected');
    });

    function getGamepadInput() {
      const gps = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = gps[0] || gps[1] || gps[2] || gps[3];
      if (!gp) return { left: false, right: false, up: false, down: false, fire: false, start: false };

      if (!gpBadge.classList.contains('connected')) {
        gpBadge.textContent = 'CONTROLE BT: CONECTADO';
        gpBadge.classList.add('connected');
      }

      const deadzone = 0.35;
      const axX = gp.axes[0] || 0;
      const axY = gp.axes[1] || 0;

      const left = axX < -deadzone || (gp.buttons[14] && gp.buttons[14].pressed);
      const right = axX > deadzone || (gp.buttons[15] && gp.buttons[15].pressed);
      const up = axY < -deadzone || (gp.buttons[12] && gp.buttons[12].pressed);
      const down = axY > deadzone || (gp.buttons[13] && gp.buttons[13].pressed);
      const fire = [0, 1, 2, 3, 5, 7].some(i => gp.buttons[i] && gp.buttons[i].pressed);
      const start = [0, 9].some(i => gp.buttons[i] && gp.buttons[i].pressed);

      return { left, right, up, down, fire, start };
    }

    function startGame() {
      score = 0;
      lives = INITIAL_LIVES;
      level = 1;
      resetRound(true);
      state = 'PLAYING';
      sfx.select();
    }

    function resetRound(fullReset = false) {
      player.x = 380;
      player.y = SURFACE_Y;
      player.dir = 1;
      player.invuln = 90;
      oxygen = 100;
      if (fullReset) rescuedCount = 0;
      torpedoes = [];
      enemies = [];
      divers = [];
      patrolSub = null;
    }

    function spawnParticles(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 25 + Math.random() * 15,
          color
        });
      }
    }

    function spawnEntities() {
      const diff = DIFFICULTIES[diffIndex];

      // Curva de velocidade: bem lenta nas fases 1 a 15, acelerando nas fases 16 a 20
      const isLateGame = level > 15;
      const levelSpeedBonus = isLateGame
        ? (14 * 0.045) + ((level - 15) * 0.24)
        : (level - 1) * 0.045;

      const maxEnemies = isLateGame
        ? diff.maxEnemiesBase + 3 + (level - 15)
        : diff.maxEnemiesBase + Math.floor((level - 1) / 5);

      const chance = isLateGame
        ? diff.spawnRate + 0.015 + (level - 15) * 0.004
        : diff.spawnRate + (level - 1) * 0.0008;

      if (enemies.length < maxEnemies && Math.random() < chance) {
        const fromLeft = Math.random() < 0.5;
        const laneY = 145 + Math.floor(Math.random() * 6) * 58;
        const isSub = Math.random() < (0.20 + level * 0.015);
        const baseSpeed = 0.95 + Math.random() * 0.65 + levelSpeedBonus;
        const speed = baseSpeed * diff.speedMult * (fromLeft ? 1 : -1);

        enemies.push({
          x: fromLeft ? -50 : 850,
          y: laneY,
          w: isSub ? 46 : 40,
          h: 18,
          vx: speed,
          type: isSub ? 'sub' : 'shark'
        });
      }

      if (divers.length < 3 && Math.random() < 0.022) {
        const fromLeft = Math.random() < 0.5;
        const laneY = 165 + Math.floor(Math.random() * 5) * 62;
        divers.push({
          x: fromLeft ? -30 : 830,
          y: laneY,
          w: 24,
          h: 14,
          vx: (0.9 + Math.random() * 0.45) * (fromLeft ? 1 : -1)
        });
      }
    }

    function hitBox(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function saveHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('mada_deep_hi', highScore);
      }
    }

    function killPlayer() {
      if (player.invuln > 0) return;
      sfx.die();
      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#f97316', 28);
      lives--;
      if (rescuedCount > 0) rescuedCount--;
      if (lives <= 0) {
        saveHighScore();
        state = 'GAMEOVER';
      } else {
        resetRound(false);
      }
    }

    function update() {
      frame++;
      const gp = getGamepadInput();
      const diff = DIFFICULTIES[diffIndex];

      // Navegação de Menu pelo Controle Bluetooth
      if (state !== 'PLAYING') {
        if (state === 'START') {
          if ((gp.left || gp.right) && !gpNavLatch) {
            gpNavLatch = true;
            changeDifficulty(gp.left ? -1 : 1);
          } else if (!gp.left && !gp.right) {
            gpNavLatch = false;
          }
        }

        if (gp.start && !gpStartLatch) {
          gpStartLatch = true;
          if (state === 'START') startGame();
          else {
            state = 'START';
            sfx.select();
          }
        } else if (!gp.start) {
          gpStartLatch = false;
        }
        return;
      }

      const moveLeft = keys['ArrowLeft'] || keys['KeyA'] || gp.left;
      const moveRight = keys['ArrowRight'] || keys['KeyD'] || gp.right;
      const moveUp = keys['ArrowUp'] || keys['KeyW'] || gp.up;
      const moveDown = keys['ArrowDown'] || keys['KeyS'] || gp.down;
      const fire = keys['Space'] || keys['KeyZ'] || keys['KeyJ'] || gp.fire;

      if (moveLeft) { player.x -= player.speed; player.dir = -1; }
      if (moveRight) { player.x += player.speed; player.dir = 1; }
      if (moveUp) { player.y -= player.speed * 0.85; }
      if (moveDown) { player.y += player.speed * 0.85; }

      player.x = Math.max(16, Math.min(canvas.width - player.w - 16, player.x));
      player.y = Math.max(SURFACE_Y, Math.min(FLOOR_Y - player.h, player.y));

      if (player.invuln > 0) player.invuln--;
      if (player.cooldown > 0) player.cooldown--;
      if (flashTimer > 0) flashTimer--;

      // Disparar Torpedo
      if (fire && player.cooldown === 0) {
        sfx.shoot();
        torpedoes.push({
          x: player.dir === 1 ? player.x + player.w : player.x - 14,
          y: player.y + 9,
          w: 16,
          h: 4,
          vx: player.dir * 10.5
        });
        player.cooldown = 15;
      }

      // Oxigênio e Progressão das 20 Fases
      const atSurface = player.y <= SURFACE_Y + 4;
      if (atSurface) {
        if (oxygen < 98) {
          oxygen = Math.min(100, oxygen + 2.2);
        }
        if (rescuedCount >= 6) {
          score += Math.floor((500 * level + oxygen * 5) * diff.scoreMult);
          rescuedCount = 0;

          if (level >= MAX_LEVELS) {
            sfx.victory();
            saveHighScore();
            state = 'VICTORY';
            return;
          }

          sfx.surface();
          level++;
          flashTimer = 25;
        } else if (rescuedCount > 0 && oxygen > 95 && moveDown) {
          rescuedCount--;
          score += Math.floor(100 * level * diff.scoreMult);
        }
      } else {
        const extraDrain = level > 15 ? (level - 15) * 0.005 : (level - 1) * 0.001;
        oxygen -= (diff.oxygenDrain + extraDrain);
        if (oxygen <= 0) {
          oxygen = 0;
          killPlayer();
          return;
        }
      }

      // Submarino de patrulha na superfície somente a partir da fase 10 (bem lento até a 15)
      if (level >= 10 && !patrolSub && Math.random() < 0.004) {
        const fromLeft = Math.random() < 0.5;
        const patrolSpeed = level <= 15 ? 1.4 : (2.2 + (level - 15) * 0.2);
        patrolSub = {
          x: fromLeft ? -60 : 860,
          y: SURFACE_Y - 2,
          w: 52,
          h: 20,
          vx: patrolSpeed * diff.speedMult * (fromLeft ? 1 : -1)
        };
      }
      if (patrolSub) {
        patrolSub.x += patrolSub.vx;
        if (hitBox(player, patrolSub)) killPlayer();
        if (patrolSub && (patrolSub.x < -100 || patrolSub.x > 900)) patrolSub = null;
      }

      spawnEntities();

      // Atualizar Torpedos
      for (let i = torpedoes.length - 1; i >= 0; i--) {
        const t = torpedoes[i];
        t.x += t.vx;
        if (t.x < -30 || t.x > 830) {
          torpedoes.splice(i, 1);
          continue;
        }
        for (let j = enemies.length - 1; j >= 0; j--) {
          const en = enemies[j];
          if (hitBox(t, en)) {
            sfx.hit();
            spawnParticles(en.x + en.w / 2, en.y + en.h / 2, en.type === 'sub' ? '#facc15' : '#38bdf8');
            score += Math.floor((en.type === 'sub' ? 60 : 40) * level * diff.scoreMult);
            enemies.splice(j, 1);
            torpedoes.splice(i, 1);
            break;
          }
        }
      }

      // Atualizar Inimigos
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.x += en.vx;
        if (en.x < -90 || en.x > 890) {
          enemies.splice(i, 1);
          continue;
        }
        if (hitBox(player, en)) {
          enemies.splice(i, 1);
          killPlayer();
          return;
        }
      }

      // Atualizar Mergulhadores
      for (let i = divers.length - 1; i >= 0; i--) {
        const d = divers[i];
        d.x += d.vx;
        if (d.x < -60 || d.x > 860) {
          divers.splice(i, 1);
          continue;
        }
        if (hitBox(player, d)) {
          if (rescuedCount < 6) {
            sfx.rescue();
            rescuedCount++;
            score += Math.floor(50 * level * diff.scoreMult);
            spawnParticles(d.x + 12, d.y + 7, '#4ade80', 10);
            divers.splice(i, 1);
          }
        }
      }

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // Desenho estilo Atari 2600
    function drawSub(x, y, dir, colorMain, colorCabin) {
      ctx.fillStyle = colorMain;
      ctx.fillRect(x + 6, y + 6, 42, 12);
      ctx.fillRect(x + (dir === 1 ? 44 : 0), y + 9, 10, 6);
      const propX = dir === 1 ? x : x + 50;
      ctx.fillStyle = '#e2e8f0';
      if (Math.floor(frame / 4) % 2 === 0) {
        ctx.fillRect(propX, y + 4, 4, 16);
      } else {
        ctx.fillRect(propX, y + 9, 4, 6);
      }
      ctx.fillStyle = colorCabin;
      ctx.fillRect(x + 20, y, 14, 7);
      ctx.fillRect(x + (dir === 1 ? 28 : 22), y - 4, 4, 5);
    }

    function drawShark(x, y, vx) {
      const dir = vx >= 0 ? 1 : -1;
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x + 6, y + 5, 28, 9);
      ctx.fillRect(x + 16, y, 8, 6);
      const tailX = dir === 1 ? x : x + 32;
      const wag = Math.sin(frame * 0.3) * 3;
      ctx.fillRect(tailX, y + 2 + wag, 7, 14);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(dir === 1 ? x + 28 : x + 9, y + 7, 3, 3);
    }

    function drawDiver(x, y, vx) {
      const dir = vx >= 0 ? 1 : -1;
      const kick = Math.floor(frame / 6) % 2 === 0 ? 2 : -2;
      ctx.fillStyle = '#fb923c';
      ctx.fillRect(dir === 1 ? x + 16 : x + 2, y + 2, 6, 6);
      ctx.fillRect(x + 6, y + 5, 12, 5);
      ctx.fillStyle = '#fde047';
      ctx.fillRect(dir === 1 ? x : x + 18, y + 4 + kick, 6, 3);
      ctx.fillRect(dir === 1 ? x : x + 18, y + 8 - kick, 6, 3);
    }

    function draw() {
      const diff = DIFFICULTIES[diffIndex];

      // Céu
      ctx.fillStyle = flashTimer > 0 && flashTimer % 4 < 2 ? '#1e3a8a' : '#0b192c';
      ctx.fillRect(0, 0, canvas.width, SURFACE_Y + 12);

      // Oceano em degradê estilo faixas Atari
      const bands = ['#023e8a', '#00509d', '#003f88', '#00296b', '#001d3d'];
      const bandH = (FLOOR_Y - (SURFACE_Y + 12)) / bands.length;
      bands.forEach((col, idx) => {
        ctx.fillStyle = col;
        ctx.fillRect(0, SURFACE_Y + 12 + idx * bandH, canvas.width, bandH + 1);
      });

      // Ondas na superfície
      ctx.fillStyle = '#7dd3fc';
      for (let x = 0; x < canvas.width; x += 24) {
        const waveY = SURFACE_Y + 10 + Math.sin((x + frame * 2) * 0.08) * 2;
        ctx.fillRect(x, waveY, 16, 4);
      }

      // Fundo do mar
      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
      ctx.fillStyle = '#854d0e';
      ctx.fillRect(0, FLOOR_Y, canvas.width, 6);

      // HUD Superior
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 22px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText(`PONTOS: ${String(score).padStart(6, '0')}`, 20, 32);

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 15px Courier New';
      ctx.fillText(`RECORDE: ${String(highScore).padStart(6, '0')} | FASE: ${level}/${MAX_LEVELS} | MODO: ${diff.name}`, 20, 56);

      // Vidas (até 10 mini submarinos)
      for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#facc15';
        ctx.fillRect(20 + i * 28, 72, 20, 8);
        ctx.fillRect(26 + i * 28, 68, 7, 4);
      }

      if (state === 'PLAYING') {
        divers.forEach(d => drawDiver(d.x, d.y, d.vx));

        enemies.forEach(en => {
          if (en.type === 'sub') drawSub(en.x, en.y, en.vx >= 0 ? 1 : -1, '#ef4444', '#fca5a5');
          else drawShark(en.x, en.y, en.vx);
        });

        if (patrolSub) {
          drawSub(patrolSub.x, patrolSub.y, patrolSub.vx >= 0 ? 1 : -1, '#a855f7', '#e9d5ff');
        }

        if (player.invuln === 0 || Math.floor(frame / 4) % 2 === 0) {
          drawSub(player.x, player.y, player.dir, '#facc15', '#fef08a');
        }

        ctx.fillStyle = '#ffffff';
        torpedoes.forEach(t => ctx.fillRect(t.x, t.y, t.w, t.h));

        particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 4, 4);
        });
      }

      // Painel Inferior (Oxigênio + Mergulhadores Resgatados)
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(140, 530, 520, 56);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(140, 530, 520, 56);

      ctx.fillStyle = oxygen < 25 && Math.floor(frame / 8) % 2 === 0 ? '#ef4444' : '#ffffff';
      ctx.font = 'bold 16px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText('OXIGÊNIO', 158, 553);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(255, 539, 385, 16);
      ctx.fillStyle = oxygen < 25 ? '#ef4444' : '#38bdf8';
      ctx.fillRect(255, 539, (oxygen / 100) * 385, 16);

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 14px Courier New';
      ctx.fillText('RESGATE:', 158, 576);
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = i < rescuedCount ? '#4ade80' : '#334155';
        ctx.fillRect(255 + i * 34, 563, 22, 12);
      }
      if (rescuedCount === 6) {
        ctx.fillStyle = '#4ade80';
        ctx.fillText('SUBA À SUPERFÍCIE!', 468, 575);
      }

      // Tela Inicial com "BOA SORTE MADA" e Seletor de Dificuldade
      if (state === 'START') {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.84)';
        ctx.fillRect(50, 120, 700, 360);
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.strokeRect(50, 120, 700, 360);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 32px Courier New';
        ctx.fillText('MADA DEEP RESCUE', 400, 170);

        // Destaque central pedido
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 46px Courier New';
        ctx.fillText('BOA SORTE MADA', 400, 245);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '15px Courier New';
        ctx.fillText('20 FASES • 10 VIDAS • USE ◄ ► PARA ESCOLHER O MODO:', 400, 295);

        // Botões de Dificuldade
        DIFFICULTIES.forEach((d, idx) => {
          const bx = 165 + idx * 165;
          const by = 315;
          const bw = 140;
          const bh = 44;
          const selected = idx === diffIndex;

          ctx.fillStyle = selected ? d.color : '#1e293b';
          ctx.fillRect(bx, by, bw, bh);
          ctx.strokeStyle = selected ? '#ffffff' : '#475569';
          ctx.lineWidth = selected ? 3 : 1;
          ctx.strokeRect(bx, by, bw, bh);

          ctx.fillStyle = selected ? '#020617' : '#94a3b8';
          ctx.font = 'bold 20px Courier New';
          ctx.fillText(d.name, bx + bw / 2, by + 29);
        });

        if (Math.floor(frame / 25) % 2 === 0) {
          ctx.fillStyle = '#4ade80';
          ctx.font = 'bold 19px Courier New';
          ctx.fillText('APERTE START / ENTER / ESPAÇO OU TOQUE PARA JOGAR', 400, 425);
        }
      }

      // Tela de Vitória (Zerar as 20 fases)
      if (state === 'VICTORY') {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
        ctx.fillRect(90, 150, 620, 300);
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 4;
        ctx.strokeRect(90, 150, 620, 300);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 38px Courier New';
        ctx.fillText('MISSÃO CUMPRIDA, MADA!', 400, 215);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 20px Courier New';
        ctx.fillText(`TODAS AS 20 FASES CONCLUÍDAS NO MODO ${diff.name}!`, 400, 265);

        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 28px Courier New';
        ctx.fillText(`PONTUAÇÃO FINAL: ${score}`, 400, 320);

        if (Math.floor(frame / 25) % 2 === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 18px Courier New';
          ctx.fillText('APERTE START / ENTER PARA VOLTAR AO MENU', 400, 395);
        }
      }

      // Tela de Game Over
      if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
        ctx.fillRect(110, 165, 580, 270);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 4;
        ctx.strokeRect(110, 165, 580, 270);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 42px Courier New';
        ctx.fillText('FIM DE JOGO', 400, 225);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = 'bold 18px Courier New';
        ctx.fillText(`CHEGOU ATÉ A FASE ${level} DE ${MAX_LEVELS} (${diff.name})`, 400, 265);

        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 26px Courier New';
        ctx.fillText(`PONTUAÇÃO FINAL: ${score}`, 400, 310);

        if (Math.floor(frame / 25) % 2 === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 18px Courier New';
          ctx.fillText('APERTE START / ENTER PARA ESCOLHER O MODO', 400, 385);
        }
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
